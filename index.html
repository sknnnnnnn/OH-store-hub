function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function startOfWeek(d){const x=startOfDay(d);const day=(x.getDay()+6)%7;return addDays(x,-day)}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function monthKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`}
function fmtDate(d,long=true){return new Intl.DateTimeFormat("th-TH",long?{weekday:"long",day:"numeric",month:"long",year:"numeric"}:{day:"numeric",month:"short"}).format(d)}
function getShift(emp,date){return scheduleMonths[monthKey(date)]?.[emp.id]?.[dateKey(date)]||"NONE"}
function hasRealSchedule(emp,date){const code=scheduleMonths[monthKey(date)]?.[emp.id]?.[dateKey(date)];return Boolean(code&&code!=="NONE")}
function hasMonthSchedule(emp,date){const days=scheduleMonths[monthKey(date)]?.[emp.id]||{};return Object.values(days).some(code=>code&&code!=="NONE")}

function cellColorCode(ctx,x0,y0,x1,y1){let red=0,yellow=0,total=0;const data=ctx.getImageData(Math.max(0,Math.floor(x0)),Math.max(0,Math.floor(y0)),Math.max(1,Math.floor(x1-x0)),Math.max(1,Math.floor(y1-y0))).data;for(let i=0;i<data.length;i+=16){const r=data[i],g=data[i+1],b=data[i+2];total++;if(r>150&&r>g*1.38&&r>b*1.35)red++;if(r>155&&g>115&&b<115&&r>g*1.02)yellow++}if(red/total>.16)return "OFF";if(yellow/total>.13)return "LEAVE";return null}
function normalizeOcrShift(textValue){const s=String(textValue||"").toUpperCase().replace(/[^A-Z0-9]/g,"");if(/^F+$/.test(s)||s.includes("OFF"))return "OFF";if(s.includes("13"))return "13";if(s.includes("11")||s==="II")return "11";if(s==="7")return "7";if(s==="6")return "6";return null}
async function parseScheduleImage(file,img){const ed=state.scheduleEditor,canvas=document.createElement("canvas"),maxWidth=1800,scale=Math.min(1,maxWidth/img.naturalWidth);canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);const ctx=canvas.getContext("2d",{willReadFrequently:true});ctx.drawImage(img,0,0,canvas.width,canvas.height);const roster=employees.filter(e=>e.id!=="p00"),rowCount=roster.length,colCount=ed.dates.length,xStart=canvas.width*.232,xEnd=canvas.width*.997,yStart=canvas.height*.102,yEnd=canvas.height*.995,rowH=(yEnd-yStart)/Math.max(1,rowCount),colW=(xEnd-xStart)/colCount;let words=[];try{const T=await loadTesseract();const result=await T.recognize(canvas,"eng",{logger:m=>{if(m.status==="recognizing text")updateImportStatus(`กำลังอ่านตัวเลขจากรูป ${Math.round((m.progress||0)*100)}%`,15+(m.progress||0)*65)}});words=result?.data?.words||[]}catch(error){updateImportStatus("อ่านสีในตารางได้ แต่ระบบอ่านข้อความจากรูปไม่สำเร็จ",78)}let found=0;roster.forEach((emp,row)=>{ed.data[emp.id]??={};ed.dates.forEach((date,col)=>{const x0=xStart+col*colW,x1=x0+colW,y0=yStart+row*rowH,y1=y0+rowH;let code=cellColorCode(ctx,x0+1,y0+1,x1-1,y1-1);if(!code){const matches=words.filter(w=>{const box=w.bbox||{},cx=((box.x0||0)+(box.x1||0))/2,cy=((box.y0||0)+(box.y1||0))/2;return cx>=x0&&cx<x1&&cy>=y0&&cy<y0+rowH*.62}).map(w=>normalizeOcrShift(w.text)).filter(Boolean);code=matches[0]||null}if(code){ed.data[emp.id][dateKey(date)]=code;found++}})});const total=roster.length*ed.dates.length,unresolved=total-found;updateImportStatus(`อ่านได้ ${found} ช่อง · เหลือ ${unresolved} ช่องให้แตะตรวจ`,100);render();toast("อ่านรูปเป็นตารางร่างแล้ว กรุณาตรวจช่อง — ก่อนบันทึก")}
async function importScheduleImage(input){const file=input.files?.[0];input.value="";if(!file)return;if(!file.type.startsWith("image/")){toast("กรุณาเลือกรูปภาพตารางงาน");return}const start=getNextScheduleCycleStart(),cycle=buildBlankScheduleCycle(start);try{const [imageUrl,img]=await Promise.all([fileToDataUrl(file),loadImageFile(file)]);state.scheduleEditor={start,end:cycle.end,dates:cycle.dates,data:cycle.data,imageUrl,imageName:file.name,importStatus:"กำลังเตรียมอ่านรูป…",importProgress:5,source:"image",protectedNextCycle:true};pushOverlay("schedule");render();await parseScheduleImage(file,img)}catch(error){toast("เปิดรูปนี้ไม่สำเร็จ ลองใช้ไฟล์ JPG หรือ PNG")}}
async function saveScheduleEditor(){const ed=state.scheduleEditor;if(ed.protectedNextCycle&&dateKey(ed.start)!==dateKey(getNextScheduleCycleStart())){toast("มีตารางรอบใหม่ถูกบันทึกแล้ว กรุณาปิดและอัปโหลดรูปอีกครั้ง");return}const touched=new Set();Object.entries(ed.data).forEach(([empId,days])=>Object.entries(days).forEach(([dk,shift])=>{const d=new Date(dk+"T00:00:00"),mk=monthKey(d);scheduleMonths[mk]??={};scheduleMonths[mk][empId]??={};scheduleMonths[mk][empId][dk]=shift;touched.add(mk)}));localStorage.setItem("oh_last_schedule_cycle",dateKey(ed.start));saveData();state.selectedDate=new Date(ed.start);state.scheduleEditor=null;consumeOverlay();render();toast(`บันทึกตารางรอบ ${fmtDate(ed.start,false)} – ${fmtDate(ed.end,false)} แล้ว`);try{await Promise.all([...touched].map(mk=>fetch(`${CONFIG.firebaseDatabaseUrl}/work_schedules/${mk}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(scheduleMonths[mk])})))}catch(e){toast("บันทึกในเครื่องแล้ว แต่ยังส่งขึ้นระบบกลางไม่สำเร็จ")}}

async function loadRemoteEmployees(){try{const r=await fetch(`${CONFIG.firebaseDatabaseUrl}/store_hub_employees.json`);if(!r.ok)return;let remote=await r.json();if(!Array.isArray(remote)||!remote.length)return;if(!remote.some(e=>e.id==="p00"))remote.unshift({...seedEmployees[0]});employees=remote.map((e,index)=>{const seed=seedEmployees.find(x=>x.id===e.id);return {...e,avatar:Number.isInteger(e.avatar)?e.avatar:(seed?.avatar??index),pattern:Array.isArray(e.pattern)?e.pattern:["NONE","NONE","NONE","NONE","NONE","NONE","NONE"]}});employees.sort((a,b)=>a.id==="p00"?-1:b.id==="p00"?1:0);saveData();if(state.currentUser&&!employees.some(e=>e.id===state.currentUser)){state.currentUser=null;localStorage.removeItem("oh_current_user");state.view="who"}render()}catch(error){}}
async function addEmployee(event){event.preventDefault();const form=event.currentTarget,data=new FormData(form),nick=String(data.get("nick")||"").trim(),role=String(data.get("role")||"").trim()||"พนักงาน",gender=data.get("gender")==="F"?"F":"M";if(!nick){toast("กรุณาใส่ชื่อเล่น");return}if(employees.some(e=>e.nick.toLowerCase()===nick.toLowerCase())){toast("มีชื่อเล่นนี้อยู่แล้ว");return}employees.push({id:`p${Date.now().toString(36)}`,nick,gender,full:"",role,avatarSeed:Math.floor(Math.random()*4294967295),pattern:["NONE","NONE","NONE","NONE","NONE","NONE","NONE"]});await persistEmployees();render();toast(`เพิ่ม ${nick} แล้ว พร้อมสุ่มตัวละครให้ใหม่`)}

async function compressEmployeePhoto(file){if(!file||!file.type.startsWith("image/"))throw new Error("type");if(file.size>20*1024*1024)throw new Error("size");const img=await loadImageFile(file),side=Math.min(img.naturalWidth,img.naturalHeight),sx=(img.naturalWidth-side)/2,sy=(img.naturalHeight-side)/2,canvas=document.createElement("canvas");canvas.width=320;canvas.height=320;canvas.getContext("2d").drawImage(img,sx,sy,side,side,0,0,320,320);return canvas.toDataURL("image/jpeg",.8)}
async function uploadEmployeePhoto(id,file){if(id!==state.currentUser){toast("เพิ่มรูปได้เฉพาะโปรไฟล์ของตัวเอง");return}if(!file)return;const emp=employees.find(e=>e.id===id);if(!emp)return;toast("กำลังเตรียมรูปโปรไฟล์…");try{emp.photo=await compressEmployeePhoto(file);await persistEmployees();render();toast(`ใส่รูปให้ ${emp.nick} แล้ว`)}catch(error){toast(error.message==="size"?"รูปใหญ่เกิน 20 MB":"ใช้รูปนี้ไม่ได้ กรุณาเลือก JPG หรือ PNG")}}

function renderRosterModal(){const rows=employees.map(emp=>`<div class="roster-row">${avatarArt(emp)}<span><b>${esc(emp.nick)}</b><small>${esc(emp.role)} · ${emp.gender==="F"?"หญิง":"ชาย"}${emp.id==="p00"?" · ผู้จัดการหลัก":""}</small></span><div class="roster-row-actions"><button class="tiny-btn" onclick="randomizeEmployeeAvatar('${emp.id}')">🎲 สุ่ม Pixel</button>${emp.id==="p00"?"":`<button class="tiny-btn delete" onclick="removeEmployee('${emp.id}')">ลบ</button>`}</div></div>`).join("");return `<div class="modal-backdrop" onclick="if(event.target===this)closeRosterModal()"><section class="modal roster-modal"><div class="editor-head"><div class="head-text"><h2>จัดการพนักงาน</h2><p>ผู้จัดการสุ่ม Pixel ได้ ส่วนรูปจริงต้องให้เจ้าตัวอัปโหลดจากชื่อของตนเอง</p></div><button class="icon-btn" onclick="closeRosterModal()">×</button></div><div class="roster-list">${rows}</div><form class="add-person" onsubmit="addEmployee(event)"><h3>＋ เพิ่มพนักงาน</h3><div class="person-form"><div class="field"><label>ชื่อเล่น</label><input name="nick" maxlength="30" placeholder="เช่น น้องเอ" required></div><div class="field"><label>ตำแหน่ง</label><input name="role" maxlength="40" placeholder="พนักงานบาร์"></div><div class="field"><label>รูปแบบตัวละคร</label><select name="gender"><option value="F">ผู้หญิง</option><option value="M">ผู้ชาย</option></select></div><button class="primary-btn wide" type="submit">สุ่มตัวละครและเพิ่มคนนี้</button></div><p class="roster-note">ระบบจะสุ่มสีเสื้อ สีผม ทรงผม และเครื่องประดับให้ คนใหม่จะมีตารางว่างรอใส่กะ</p></form></section></div>`}
function renderSchedule(isDay=false){const d=state.selectedDate,sum=daySummary(d),groups=groupEmployees(d);return `${header(true,"ตารางงาน")}<main class="shell"><div class="page-head"><div class="head-text"><div class="eyebrow">ตารางงานวันนี้</div><h1 class="page-title">${fmtDate(d)}</h1><p class="page-sub">กดชื่อเพื่อดูตารางรายคน · ระบบจะแสดงเฉพาะกะที่บันทึกจริง</p></div><div class="schedule-actions"><button class="ghost-btn" onclick="state.selectedDate=startOfDay(new Date());state.view='schedule';render()">วันนี้</button><button class="upload-btn" onclick="document.getElementById('scheduleImageInput').click()">▧ อัปโหลดรูปรอบถัดไป</button><button class="roster-btn" onclick="openRosterModal()">☺ จัดการพนักงาน</button><button class="manager-btn" onclick="openNextMonthEditor()">＋ กรอกตารางรอบถัดไป</button></div><input id="scheduleImageInput" type="file" accept="image/jpeg,image/png,image/webp" hidden onchange="importScheduleImage(this)"></div>${dateStrip()}<div class="summary-row"><div class="summary green"><b>${sum.working}</b><span>เข้างาน</span></div><div class="summary"><b>${groups["กะเช้า"].length}</b><span>กะเช้า</span></div><div class="summary orange"><b>${groups["กะบ่าย"].length}</b><span>กะบ่าย</span></div><div class="summary red"><b>${sum.off}</b><span>หยุด / ลา</span></div><div class="summary gray"><b>${sum.unassigned}</b><span>ไม่มีข้อมูล</span></div></div><div class="panel"><div class="panel-head"><h3>พนักงานทั้งหมด</h3><span class="count">${employees.length} คน</span></div>${dayContent(d)}</div></main>${state.scheduleEditor?renderScheduleEditor():""}${state.rosterModal?renderRosterModal():""}`}

function renderPersonWeek(emp,start){let cards="";for(let i=0;i<7;i++){const d=addDays(start,i),code=getShift(emp,d),s=shiftInfo[code],today=dateKey(d)===dateKey(new Date());cards+=`<button class="day-card shift-${code} ${today?'today':''} ${code==='OFF'?'off':''}" onclick="state.selectedDate=startOfDay(new Date('${dateKey(d)}T00:00:00'));state.view='day';render()"><div class="dow">${thaiDays[d.getDay()]}</div><div class="num">${d.getDate()}</div><div class="shift">${s.label}</div></button>`}return `<div class="panel"><div class="panel-head"><h3>${fmtDate(start,false)} – ${fmtDate(addDays(start,6),false)}</h3><span class="count">กดวันที่เพื่อดูทุกคน</span></div><div style="padding:16px"><div class="week-grid">${cards}</div></div></div>`}
function renderPersonMonth(emp,date){const first=new Date(date.getFullYear(),date.getMonth(),1),monthTitle=new Intl.DateTimeFormat('th-TH',{month:'long',year:'numeric'}).format(first);if(!hasMonthSchedule(emp,first))return `<div class="panel no-schedule"><div class="no-schedule-icon">◷</div><h3>ไม่มีข้อมูลตารางงาน</h3><p>${esc(emp.nick)} ยังไม่มีตารางสำหรับเดือน${monthTitle}<br>ระบบจะไม่เดาเวลาเข้างานให้ เพื่อป้องกันความสับสน</p></div>`;const gridStart=startOfWeek(first);let cells=["จ","อ","พ","พฤ","ศ","ส","อา"].map(x=>`<div class="month-weekday">${x}</div>`).join("");for(let i=0;i<42;i++){const d=addDays(gridStart,i),code=getShift(emp,d),s=shiftInfo[code]||shiftInfo.NONE,muted=d.getMonth()!==first.getMonth(),today=dateKey(d)===dateKey(new Date());cells+=`<button class="month-day shift-${code} ${muted?'muted':''} ${today?'today':''} ${code==='OFF'?'off':''}" onclick="state.selectedDate=startOfDay(new Date('${dateKey(d)}T00:00:00'));state.view='day';render()"><b>${d.getDate()}</b><span>${code==='NONE'?'ไม่มีข้อมูล':s.short}</span></button>`}return `<div class="panel"><div class="panel-head"><h3>${monthTitle}</h3><span class="count">กดวันที่เพื่อดูทุกคน</span></div><div class="month-grid">${cells}</div></div>`}

function easyCatalogName(name){return String(name||"").replace(/\([^)]*\)/g,"").replace(/^(สำเร็จรูป|ผลไม้แช่แข็ง|ผลไม้|วัตถุดิบต้ม|HQผักล้างแปรรูป|HQ|ผักTopping|นมเปรี้ยวโยเกิร์ต|น้ำผลไม้)\s*/i,"").trim().slice(0,42)||String(name||"")}
async function syncStoreCatalog(){if(state.catalogLoading)return;state.catalogLoading=true;if(state.view==="store")render();try{const [dailyRes,weeklyRes,inventoryRes]=await Promise.all([fetch(`${CONFIG.sheetsWebAppUrl}?mode=daily`),fetch(`${CONFIG.sheetsWebAppUrl}?mode=weekly`),fetch(`${CONFIG.firebaseDatabaseUrl}/store_hub_inventory.json`)]);if(!dailyRes.ok||!weeklyRes.ok)throw new Error("catalog");const daily=await dailyRes.json(),weekly=await weeklyRes.json(),catalog=[...new Map([...daily,...weekly].map(item=>[String(item.id),item])).values()],central=inventoryRes.ok?(await inventoryRes.json()||{}):{},old=new Map(products.map(p=>[p.code,p]));products=catalog.map(item=>{const prev=old.get(String(item.id))||{},saved=central[String(item.id)]||{};return {id:String(item.id),easy:saved.easy||prev.easy||easyCatalogName(item.name),code:String(item.id),real:item.name||"",category:item.category||"ทั่วไป",stock:Number(saved.stock??prev.stock??0),unit:item.unit||"หน่วย",min:Number(saved.min??prev.min??0),last:saved.last||prev.last||null}});state.catalogLoaded=true;saveData()}catch(e){toast("ยังดึงรายการจากระบบนับของไม่ได้ จะแสดงข้อมูลที่บันทึกไว้ก่อน")}finally{state.catalogLoading=false;if(state.view==="store")render()}}
async function sheetPost(payload){const r=await fetch(CONFIG.sheetsWebAppUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),redirect:"follow"});if(!r.ok)throw new Error("sheet");const data=await r.json();if(data.status&&data.status!=="success")throw new Error(data.message||"sheet");return data}

function assertHubResponse(data,mode){if(!data||data.status!=="success"||data.apiVersion!==CONFIG.apiVersion||data.mode!==mode||data.spreadsheetId!==CONFIG.storeSpreadsheetId||(mode==="store"||mode==="storeSave")&&data.sheetName!=="สโตร์")throw new Error("wrong_deployment");return data}
async function pullStoreFromSheet(){if(state.storeSyncing)return;if(state.storeDirty&&!confirm("มีข้อมูลในแอปที่ยังไม่ได้บันทึกลงชีต หากดึงข้อมูล ยอดเหล่านั้นอาจถูกแทนที่\n\nต้องการดำเนินการต่อหรือไม่?"))return;state.storeSyncing=true;render();try{const r=await fetch(`${CONFIG.sheetsWebAppUrl}?mode=store&t=${Date.now()}`);if(!r.ok)throw new Error("sheet");const data=assertHubResponse(await r.json(),"store"),items=Array.isArray(data.items)?data.items:[];if(!items.length){toast("ชีตสโตร์ยังไม่มีข้อมูล กรุณากดบันทึกลงชีตก่อน");return}const byCode=new Map(items.map(x=>[String(x.id||x.code),x]));products.forEach(p=>{const row=byCode.get(String(p.code));if(row){p.stock=Number(row.stock??row.balance??0);p.last=row.updatedAt?{type:"sync",qty:0,time:row.updatedAt,operator:row.updatedBy||"ชีต"}:p.last}});saveData();setStoreDirty(false);state.storeLastSync=new Date().toISOString();localStorage.setItem("oh_store_last_sync",state.storeLastSync);render();toast(`ดึงข้อมูลจากชีตแล้ว ${items.length} รายการ`)}catch(error){toast(error.message==="wrong_deployment"?"หยุดดึงข้อมูล: Apps Script ยังเป็นเวอร์ชันเก่า":"ดึงข้อมูลจากชีตไม่สำเร็จ กรุณาตรวจ Apps Script")}finally{state.storeSyncing=false;if(state.view==="store")render()}}
async function saveStoreToSheet(){if(state.storeSyncing)return;const user=activeEmployee();if(!user){toast("กรุณาเลือกชื่อผู้ใช้งานก่อน");return}if(!confirm(`บันทึกยอดสโตร์ปัจจุบัน ${products.length} รายการลงชีต โดย ${user.nick} ใช่หรือไม่?`))return;state.storeSyncing=true;render();try{const result=assertHubResponse(await sheetPost({mode:"storeSave",operator:user.nick,operatorId:user.id,items:products.map(p=>({id:p.code,name:p.real,unit:p.unit,stock:Number(p.stock)||0}))}),"storeSave");if(result.count!==products.length)throw new Error("count_mismatch");setStoreDirty(false);state.storeLastSync=new Date().toISOString();localStorage.setItem("oh_store_last_sync",state.storeLastSync);render();toast(`บันทึกลงชีตสโตร์แล้ว ${result.count} รายการ · โดย ${user.nick}`)}catch(error){setStoreDirty(true);toast(error.message==="wrong_deployment"?"หยุดบันทึก: Apps Script ยังเป็นเวอร์ชันเก่า · ไม่ได้แตะ Stock_Weekly":"ยังบันทึกลงชีตไม่สำเร็จ ข้อมูลในแอปยังอยู่")}finally{state.storeSyncing=false;if(state.view==="store")render()}}
function renderStore(){if(!state.catalogLoaded&&!state.catalogLoading)setTimeout(syncStoreCatalog,0);const s=storeSummary(),user=activeEmployee(),found=filteredProducts(),rows=found.map(productTableRow).join(""),cards=found.map(productCard).join(""),syncText=state.storeDirty?"มีข้อมูลที่ยังไม่ได้บันทึกลงชีต":state.storeLastSync?`บันทึกลงชีตล่าสุด ${new Intl.DateTimeFormat('th-TH',{dateStyle:'short',timeStyle:'short'}).format(new Date(state.storeLastSync))}`:"ยังไม่เคยซิงก์กับชีต";return `${header(true,"สโตร์")}<main class="shell"><section class="store-hero"><div class="store-hero-copy"><div class="eyebrow">OH STORE INVENTORY</div><h1>สโตร์หลังร้าน</h1><p>${state.catalogLoading?'กำลังดึงรายการสินค้าล่าสุด…':'รับเข้า–เบิกออก ค้นหาง่าย และเห็นยอดคงเหลือทันที'}</p></div>${user?`<div class="store-user">${avatarArt(user)}<span><small>ผู้ทำรายการ</small><b>${esc(user.nick)}</b></span></div>`:""}</section><div class="sync-panel"><div class="sync-status"><b><span class="${state.storeDirty?'dirty-dot':'clean-dot'}"></span>${syncText}</b><small>ชีตสโตร์จะสร้างให้อัตโนมัติเมื่อบันทึกครั้งแรก</small></div><button class="sync-btn" ${state.storeSyncing?'disabled':''} onclick="pullStoreFromSheet()">↓ ดึงข้อมูลจากชีต</button><button class="sync-btn save" ${state.storeSyncing?'disabled':''} onclick="saveStoreToSheet()">↑ บันทึกลงชีต</button></div><div class="summary-row"><div class="summary"><b>${s.items}</b><span>รายการสินค้า</span></div><div class="summary green"><b>${s.total.toLocaleString('th-TH')}</b><span>จำนวนรวมในสโตร์</span></div><div class="summary red"><b>${s.low}</b><span>ใกล้หมด</span></div><div class="summary orange"><b>${s.today}</b><span>เคลื่อนไหววันนี้</span></div></div><div class="toolbar"><label class="search"><input value="${esc(state.storeQuery)}" oninput="state.storeQuery=this.value;renderStoreRows()" placeholder="ค้นหาชื่อ รหัส หรือชื่อจริง"></label><div class="store-actions"><button class="ghost-btn" onclick="go('history')">ประวัติ</button><button class="action-btn receive" onclick="openStockModal('receive')">＋ ทำรายการ</button></div></div><div class="table-wrap desktop-stock"><table class="store-table"><thead><tr><th>ชื่อค้นหาง่าย</th><th>รหัส</th><th>ชื่อจริง</th><th>คงเหลือ</th><th>หน่วย</th><th>รายการล่าสุด</th><th>ทำรายการ</th></tr></thead><tbody id="storeRows">${rows||`<tr><td colspan="7" class="empty">${state.catalogLoading?'กำลังโหลดรายการ…':'ไม่พบสินค้าที่ค้นหา'}</td></tr>`}</tbody></table></div><section id="storeCards" class="mobile-stock">${cards||`<div class="empty panel">${state.catalogLoading?'กำลังโหลดรายการ…':'ไม่พบสินค้าที่ค้นหา'}</div>`}</section></main>${state.modal?renderStockModal():""}`}
function renderStoreRows(){const body=document.getElementById("storeRows"),cards=document.getElementById("storeCards"),found=filteredProducts();if(body)body.innerHTML=found.map(productTableRow).join("")||`<tr><td colspan="7" class="empty">ไม่พบสินค้าที่ค้นหา</td></tr>`;if(cards)cards.innerHTML=found.map(productCard).join("")||`<div class="empty panel">ไม่พบสินค้าที่ค้นหา</div>`}
function openStockModal(type,productId=null){state.modal=type;state.cart=[];state.productQuery="";state.selectedProduct=productId;pushOverlay("stock");render()}
function switchStockMode(type){if(state.modal===type)return;if(state.cart.length&&!confirm("เปลี่ยนประเภทแล้วรายการที่เตรียมไว้จะถูกล้าง ต้องการเปลี่ยนหรือไม่?"))return;state.modal=type;state.cart=[];state.selectedProduct=null;render()}
function closeModal(fromHistory=false){if(!fromHistory&&window.history.state?.overlay==="stock"){window.history.back();return}state.modal=null;state.cart=[];state.selectedProduct=null;render()}
function modalResults(){const q=state.productQuery.trim().toLowerCase();if(!q)return "";const found=products.filter(p=>[p.easy,p.code,p.real].some(v=>v.toLowerCase().includes(q))).slice(0,6);return `<div class="results">${found.length?found.map(p=>`<button class="result" onclick="selectProduct('${p.id}')"><span><b>${esc(p.easy)}</b><small>${esc(p.code)} · ${esc(p.real)}</small></span><span class="stock">${p.stock} ${esc(p.unit)}</span></button>`).join(""):`<div class="empty">ไม่พบสินค้า</div>`}</div>`}
function selectProduct(id){state.selectedProduct=id;state.productQuery="";render()}
function renderStockModal(){const isIn=state.modal==="receive",p=products.find(x=>x.id===state.selectedProduct);return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal ${isIn?'receive-mode':'issue-mode'}"><div class="modal-title"><h2>ทำรายการสโตร์</h2><button class="icon-btn close" onclick="closeModal()">×</button></div><div class="mode-switch"><button class="receive ${isIn?'active':''}" onclick="switchStockMode('receive')">＋ รับเข้า</button><button class="issue ${!isIn?'active':''}" onclick="switchStockMode('issue')">− เบิกออก</button></div><label class="search"><input id="modalSearch" value="${esc(state.productQuery)}" oninput="state.productQuery=this.value;updateModalResults()" placeholder="พิมพ์ชื่อ รหัส หรือชื่อจริง" autocomplete="off"></label><div id="modalResults">${modalResults()}</div>${p?renderSelectedProduct(p,isIn):""}${renderCart(isIn)}</section></div>`}
function updateModalResults(){const target=document.getElementById("modalResults");if(target)target.innerHTML=modalResults()}
function renderSelectedProduct(p,isIn){return `<div class="selected-product"><h3>${esc(p.easy)}</h3><p>${esc(p.code)} · ${esc(p.real)}</p><div class="quantity-row"><div class="field"><label>จำนวน${isIn?'รับเข้า':'เบิกออก'}</label><input id="qtyInput" type="number" min="1" step="1" inputmode="numeric" placeholder="0" oninput="updateProjection('${p.id}')"></div><div class="field"><label>หน่วย</label><input value="${esc(p.unit)}" disabled></div></div><div class="projection" id="projection">คงเหลือปัจจุบัน <strong>${p.stock}</strong> ${esc(p.unit)}</div><button class="primary-btn add-line" onclick="addToCart('${p.id}')">เพิ่มรายการ</button></div>`}
function updateProjection(id){const p=products.find(x=>x.id===id),q=Math.max(0,Number(document.getElementById("qtyInput")?.value||0)),after=state.modal==="receive"?p.stock+q:p.stock-q,el=document.getElementById("projection");if(el)el.innerHTML=`คงเหลือ ${p.stock} → <strong style="color:${after<0?'var(--red)':'inherit'}">${after}</strong> ${esc(p.unit)}`}
function addToCart(id){const p=products.find(x=>x.id===id),input=document.getElementById("qtyInput"),qty=Number(input?.value||0);if(!Number.isFinite(qty)||qty<=0){toast("กรุณาใส่จำนวนที่มากกว่า 0");return}const current=state.cart.find(x=>x.id===id);const total=qty+(current?.qty||0);if(state.modal==="issue"&&total>p.stock){toast(`ยอดคงเหลือมีเพียง ${p.stock} ${p.unit}`);return}if(current)current.qty=total;else state.cart.push({id,qty});state.selectedProduct=null;render()}
function removeCart(id){state.cart=state.cart.filter(x=>x.id!==id);render()}
function renderCart(isIn){if(!state.cart.length)return "";const user=activeEmployee();return `<div class="cart"><h3>รายการที่เตรียมยืนยัน (${state.cart.length})</h3>${state.cart.map(x=>{const p=products.find(y=>y.id===x.id),after=isIn?p.stock+x.qty:p.stock-x.qty;return `<div class="cart-line"><span><b>${esc(p.easy)}</b><small>${p.stock} → ${after} ${esc(p.unit)}</small></span><span class="delta" style="color:${isIn?'var(--green)':'var(--orange)'}">${isIn?'+':'−'}${x.qty}</span><button class="remove" onclick="removeCart('${p.id}')">×</button></div>`}).join("")}${user?`<div class="operator-chip">${avatarArt(user)}<span><small>ผู้ทำรายการจากชื่อที่เลือกตอนเข้าเว็บ</small><b>${esc(user.nick)}</b></span></div>`:`<div class="operator-chip"><span><b>ยังไม่ได้เลือกผู้ใช้งาน</b><small>กลับไปเลือกชื่อก่อนยืนยันรายการ</small></span></div>`}<div class="confirm-bar"><button onclick="confirmTransaction()">ยืนยัน${isIn?'รับเข้า':'เบิกออก'} ${state.cart.length} รายการ</button></div></div>`}
async function confirmTransaction(){const user=activeEmployee();if(!user){toast("กรุณาเลือกชื่อผู้ใช้งานก่อนทำรายการ");state.modal=null;state.view="who";consumeOverlay();render();return}const operator=user.nick,operatorId=user.id,type=state.modal,now=new Date().toISOString(),lines=state.cart.map(x=>({productId:x.id,qty:x.qty})),centralLines=[];for(const line of lines){const p=products.find(x=>x.id===line.productId);p.stock+=type==="receive"?line.qty:-line.qty;p.last={type,qty:line.qty,time:now,operator,operatorId};history.unshift({id:`tx-${Date.now()}-${line.productId}`,type,productId:p.id,easy:p.easy,code:p.code,qty:line.qty,unit:p.unit,operator,operatorId,time:now,balance:p.stock});centralLines.push({productId:p.id,easy:p.easy,code:p.code,qty:line.qty,unit:p.unit,balance:p.stock,last:p.last})}saveData();setStoreDirty(true);state.flashId=lines[0]?.productId||null;state.modal=null;state.cart=[];state.selectedProduct=null;consumeOverlay();render();toast(`${type==='receive'?'รับเข้า':'เบิกออก'}เรียบร้อย · โดย ${operator}`);setTimeout(()=>{state.flashId=null},1800);try{await Promise.all(centralLines.map(x=>fetch(`${CONFIG.firebaseDatabaseUrl}/store_hub_inventory/${x.productId}.json`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({easy:x.easy,stock:x.balance,unit:x.unit,last:x.last})})));await fetch(`${CONFIG.firebaseDatabaseUrl}/store_hub_transactions.json`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type,operator,operatorId,time:now,lines:centralLines})})}catch(e){toast("บันทึกในเครื่องแล้ว แต่ยังส่งยอดสโตร์ขึ้นระบบกลางไม่สำเร็จ")}}
function renderHistory(){const items=history.slice(0,100).map(h=>`<div class="history-item"><span class="history-icon ${h.type==='receive'?'in':'out'}">${h.type==='receive'?'+':'−'}</span><span class="history-main"><b>${h.type==='receive'?'รับเข้า':'เบิกออก'} ${esc(h.easy)} ${h.qty} ${esc(h.unit)}</b><small>${new Intl.DateTimeFormat('th-TH',{dateStyle:'medium',timeStyle:'short'}).format(new Date(h.time))} · โดย ${esc(h.operator)}</small></span><strong>เหลือ ${h.balance}</strong></div>`).join("");return `${header(true,"ประวัติสโตร์")}<main class="shell"><div class="page-head"><div class="head-text"><div class="eyebrow">ตรวจสอบย้อนหลัง</div><h1 class="page-title">ประวัติรับเข้า–เบิกออก</h1><p class="page-sub">แสดง 100 รายการล่าสุด</p></div></div><div class="history-list">${items||`<div class="empty panel">ยังไม่มีประวัติการทำรายการ</div>`}</div></main>`}

function firebaseValues(data){return data&&typeof data==="object"?Object.values(data):[]}
function finiteNumber(value){const n=Number(value);return Number.isFinite(n)?n:0}
function usageUnit(item){return item.unit||products.find(p=>p.code===item.id)?.unit||"หน่วย"}
async function loadUsage(){if(state.usageLoading)return;state.usageLoading=true;render();try{const [currentRes,snapshotRes,transactionRes]=await Promise.all([fetch(`${CONFIG.sheetsWebAppUrl}?mode=usageCurrent&t=${Date.now()}`),fetch(`${CONFIG.firebaseDatabaseUrl}/usage_snapshots.json`),fetch(`${CONFIG.firebaseDatabaseUrl}/store_hub_transactions.json`)]);if(!currentRes.ok)throw new Error("sheet");const current=await currentRes.json(),snapshots=snapshotRes.ok?(await snapshotRes.json()||{}):{},transactions=transactionRes.ok?(await transactionRes.json()||{}):{},now=new Date(),today=dateKey(now);const previous=Object.entries(snapshots).map(([key,value])=>({key,...value})).filter(x=>x.createdAt&&dateKey(new Date(x.createdAt))<today).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))[0]||null;const received={};if(previous){firebaseValues(transactions).forEach(tx=>{if(tx?.type!=="receive"||!tx.time||new Date(tx.time)<=new Date(previous.createdAt))return;(tx.lines||[]).forEach(line=>{const id=String(line.productId||line.code||"");received[id]=(received[id]||0)+finiteNumber(line.qty)})})}const currentItems=Array.isArray(current.items)?current.items:[];const rows=currentItems.map(item=>{const id=String(item.id||item.code||""),daily=finiteNumber(item.daily),store=finiteNumber(item.store),total=finiteNumber(item.total??daily+store),prev=previous?.items?.[id],receipt=received[id]||0;return {id,name:item.name||id,unit:usageUnit({...item,id}),daily,store,total,previous:prev?finiteNumber(prev.total):null,received:receipt,used:prev?finiteNumber(prev.total)+receipt-total:null}});state.usage={loadedAt:new Date().toISOString(),sourceTimestamp:current.sourceTimestamp||"",rows,previous,currentRaw:current};render();toast(previous?"คำนวณการใช้วันนี้แล้ว":"ดึงยอดแล้ว กรุณายืนยันเป็นข้อมูลตั้งต้นครั้งแรก")}catch(error){toast("ดึงข้อมูลการใช้วันนี้ไม่สำเร็จ กรุณาอัปเดต Apps Script ก่อน")}finally{state.usageLoading=false;if(state.view==="usage")render()}}
async function saveUsageSnapshot(){const user=activeEmployee();if(!user||!state.usage){toast("กรุณาดึงข้อมูลก่อนบันทึก");return}const key=dateKey(new Date()),existing=await fetch(`${CONFIG.firebaseDatabaseUrl}/usage_snapshots/${key}.json`).then(r=>r.ok?r.json():null).catch(()=>null);if(existing&&!confirm("วันนี้มีข้อมูลตั้งต้นแล้ว ต้องการแทนที่ด้วยยอดล่าสุดหรือไม่?"))return;const items={};state.usage.rows.forEach(row=>{items[row.id]={name:row.name,unit:row.unit,daily:row.daily,store:row.store,total:row.total}});const payload={createdAt:new Date().toISOString(),createdBy:user.nick,createdById:user.id,sourceTimestamp:state.usage.sourceTimestamp||"",items};try{const r=await fetch(`${CONFIG.firebaseDatabaseUrl}/usage_snapshots/${key}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});if(!r.ok)throw new Error("firebase");toast("บันทึกยอดนี้เป็นข้อมูลตั้งต้นแล้ว");await loadUsage()}catch(error){toast("บันทึกข้อมูลตั้งต้นไม่สำเร็จ")}}
function usageNumber(value,unit){if(value===null)return "—";const rounded=Math.round(value*100)/100;return `${rounded.toLocaleString("th-TH",{maximumFractionDigits:2})} ${esc(unit)}`}
function renderUsage(){const data=state.usage,rows=data?.rows||[],previous=data?.previous;return `${header(true,"การใช้วันนี้")}<main class="shell"><section class="usage-hero"><div class="eyebrow">DAILY + สโตร์</div><h1>การใช้วันนี้</h1><p>ยอดครั้งก่อน + รับเข้าหลังครั้งก่อน − ยอดคงเหลือล่าสุด</p></section><div class="sync-panel"><div class="sync-status"><b>${state.usageLoading?'กำลังดึงข้อมูล…':data?`ดึงล่าสุด ${new Intl.DateTimeFormat('th-TH',{timeStyle:'short'}).format(new Date(data.loadedAt))}`:'ยังไม่ได้ดึงข้อมูล'}</b><small>ระบบทำงานเมื่อกดปุ่มเท่านั้น และไม่แก้ข้อมูลในชีต</small></div><button class="sync-btn" ${state.usageLoading?'disabled':''} onclick="loadUsage()">↓ ดึงยอดล่าสุด</button>${data?`<button class="sync-btn save" onclick="saveUsageSnapshot()">✓ บันทึกเป็นยอดตั้งต้น</button>`:""}</div>${!data?`<section class="baseline"><h3>กด “ดึงยอดล่าสุด” เพื่อเริ่ม</h3><p>ระบบจะอ่านยอดคงเหลือจาก DAILY คอลัมน์ J และยอดจากชีตสโตร์</p></section>`:!previous?`<section class="baseline"><h3>ยังคำนวณการใช้ไม่ได้ในครั้งแรก</h3><p>ยอดที่เห็นเป็นยอดปัจจุบัน กรุณาตรวจแล้วกด “บันทึกเป็นยอดตั้งต้น”<br>ครั้งถัดไประบบจึงจะแสดงส่วนต่างโดยไม่เดาข้อมูล</p></section>`:`<div class="page-head"><div class="head-text"><div class="eyebrow">เทียบกับข้อมูลเมื่อ ${new Intl.DateTimeFormat('th-TH',{dateStyle:'medium',timeStyle:'short'}).format(new Date(previous.createdAt))}</div><h2 class="page-title">คำนวณได้ ${rows.length} รายการ</h2><p class="page-sub">ค่าติดลบหมายถึงยอดเพิ่มขึ้นมากกว่าที่บันทึกเป็น “รับเข้า” กรุณาตรวจรายการนั้น</p></div></div><section class="usage-list">${rows.map(row=>`<article class="usage-card"><span class="usage-name"><b>${esc(row.name)}</b><small>${esc(row.id)} · DAILY ${usageNumber(row.daily,row.unit)} + สโตร์ ${usageNumber(row.store,row.unit)} = ${usageNumber(row.total,row.unit)}</small></span><span class="usage-metric"><span>ครั้งก่อน</span><b>${usageNumber(row.previous,row.unit)}</b></span><span class="usage-metric"><span>รับเข้า</span><b>${usageNumber(row.received,row.unit)}</b></span><span class="usage-metric"><span>ใช้วันนี้</span><b class="usage-value ${(row.used||0)>=0?'positive':'negative'}">${usageNumber(row.used,row.unit)}</b></span></article>`).join("")||`<div class="empty panel">ไม่พบรายการจาก DAILY หรือสโตร์</div>`}</section>`}</main>`}

function memoStatus(memo){const now=startOfDay(new Date()),start=memo.startDate?startOfDay(new Date(memo.startDate+"T00:00:00")):null,end=memo.expiryDate?startOfDay(new Date(memo.expiryDate+"T00:00:00")):null;if(end&&end<now)return {key:"expired",label:"หมดอายุ"};if(start&&start>now)return {key:"upcoming",label:"เร็ว ๆ นี้"};if(end&&Math.ceil((end-now)/86400000)<=7)return {key:"soon",label:"ใกล้หมดอายุ"};return {key:"active",label:"กำลังใช้"}}
async function loadMemos(){if(state.memoLoading)return;state.memoLoading=true;if(state.view==="memo")render();try{const r=await fetch(`${CONFIG.firebaseDatabaseUrl}/memo_promotions.json`);if(!r.ok)throw new Error("firebase");const data=await r.json()||{};state.memos=Object.entries(data).map(([id,m])=>({id,...m})).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));state.memoLoaded=true}catch(error){toast("ดึง Memo & Promotion ไม่สำเร็จ")}finally{state.memoLoading=false;if(state.view==="memo")render()}}
function openMemoModal(){if(!activeEmployee()){toast("กรุณาเลือกชื่อผู้ใช้งานก่อน");return}state.memoModal=true;pushOverlay("memo");render()}
function closeMemoModal(fromHistory=false){if(!fromHistory&&window.history.state?.overlay==="memo"){window.history.back();return}state.memoModal=false;render()}
function openPdfViewer(id){state.pdfViewer=state.memos.find(m=>m.id===id)||null;if(!state.pdfViewer)return;pushOverlay("pdf");render()}
function closePdfViewer(fromHistory=false){if(!fromHistory&&window.history.state?.overlay==="pdf"){window.history.back();return}state.pdfViewer=null;render()}
function loadPdfJs(){if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);return new Promise((resolve,reject)=>{const script=document.createElement("script");script.src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";script.type="module";script.onload=()=>resolve(window.pdfjsLib);script.onerror=reject;document.head.appendChild(script)})}
async function pdfThumbnail(file){try{const pdfjs=await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs");pdfjs.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";const pdf=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise,page=await pdf.getPage(1),base=page.getViewport({scale:1}),scale=Math.min(1.6,520/base.width),viewport=page.getViewport({scale}),canvas=document.createElement("canvas");canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);await page.render({canvasContext:canvas.getContext("2d"),viewport}).promise;return canvas.toDataURL("image/jpeg",.72)}catch(error){return ""}}
async function uploadMemo(event){event.preventDefault();const user=activeEmployee();if(!user){toast("กรุณาเลือกชื่อผู้ใช้งานก่อน");return}const form=event.currentTarget,data=new FormData(form),file=data.get("pdf"),title=String(data.get("title")||"").trim();if(!file||file.type!=="application/pdf"){toast("กรุณาเลือกไฟล์ PDF");return}if(file.size>8*1024*1024){toast("ไฟล์ PDF ต้องไม่เกิน 8 MB");return}const submit=form.querySelector('[type="submit"]'),bar=document.getElementById("memoUploadBar");submit.disabled=true;submit.textContent="กำลังเตรียมไฟล์…";if(bar)bar.style.width="15%";try{const [dataUrl,thumbnail]=await Promise.all([fileToDataUrl(file),pdfThumbnail(file)]);if(bar)bar.style.width="45%";submit.textContent="กำลังอัปโหลดไป Google Drive…";const uploaded=await sheetPost({mode:"promotionUpload",folderId:CONFIG.promotionDriveFolderId,title,fileName:file.name,mimeType:file.type,base64:String(dataUrl).split(",")[1]});if(bar)bar.style.width="78%";const id=`memo_${Date.now()}`,payload={title,type:String(data.get("type")||"promotion"),startDate:String(data.get("startDate")||""),expiryDate:String(data.get("expiryDate")||""),note:String(data.get("note")||"").trim(),fileId:uploaded.fileId,previewUrl:uploaded.previewUrl,viewUrl:uploaded.viewUrl,thumbnail,createdAt:new Date().toISOString(),createdBy:user.nick,createdById:user.id};const saved=await fetch(`${CONFIG.firebaseDatabaseUrl}/memo_promotions/${id}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});if(!saved.ok)throw new Error("firebase");if(bar)bar.style.width="100%";state.memos.unshift({id,...payload});state.memoLoaded=true;state.memoModal=false;consumeOverlay();render();toast(`เพิ่ม PDF แล้ว · โดย ${user.nick}`)}catch(error){submit.disabled=false;submit.textContent="อัปโหลด PDF";toast("อัปโหลดไม่สำเร็จ กรุณาตรวจ Apps Script และสิทธิ์โฟลเดอร์")}}
function canDeleteMemo(memo){return state.currentUser==="p00"||memo?.createdById===state.currentUser}
async function deleteMemo(id){const memo=state.memos.find(m=>m.id===id);if(!memo||!canDeleteMemo(memo))return;if(!confirm(`นำ “${memo.title}” ออกจากหน้า Memo หรือไม่?\nไฟล์ต้นฉบับใน Drive จะยังอยู่`))return;try{await fetch(`${CONFIG.firebaseDatabaseUrl}/memo_promotions/${id}.json`,{method:"DELETE"});state.memos=state.memos.filter(m=>m.id!==id);render();toast("นำรายการออกแล้ว ไฟล์ใน Drive ยังอยู่")}catch(error){toast("ลบรายการไม่สำเร็จ")}}
function renderMemoModal(){const today=dateKey(new Date());return `<div class="modal-backdrop" onclick="if(event.target===this)closeMemoModal()"><section class="modal"><div class="modal-title"><h2>เพิ่ม Memo หรือ Promotion</h2><button class="icon-btn close" onclick="closeMemoModal()">×</button></div><form class="upload-form" onsubmit="uploadMemo(event)"><div class="field wide"><label>ชื่อเรื่อง</label><input name="title" maxlength="100" required placeholder="เช่น Promotion เดือนตุลาคม"></div><div class="field"><label>ประเภท</label><select name="type"><option value="promotion">Promotion</option><option value="memo">Memo</option><option value="announcement">ประกาศ</option></select></div><div class="field"><label>วันเริ่มใช้</label><input type="date" name="startDate" value="${today}"></div><div class="field"><label>วันหมดอายุ</label><input type="date" name="expiryDate"></div><div class="field wide"><label>หมายเหตุ</label><textarea name="note" maxlength="500" placeholder="รายละเอียดสั้น ๆ ที่ควรรู้"></textarea></div><label class="file-box wide"><b>แนบไฟล์ PDF</b><small style="display:block;color:var(--muted);margin-top:4px">ไม่เกิน 8 MB · ระบบจะสร้างภาพหน้าปกจากหน้าแรก</small><input type="file" name="pdf" accept="application/pdf" required style="margin-top:12px;width:100%"></label><div class="upload-progress wide"><i id="memoUploadBar"></i></div><button class="primary-btn wide" type="submit">อัปโหลด PDF</button></form></section></div>`}
function renderPdfViewer(){const memo=state.pdfViewer;if(!memo)return "";return `<div class="modal-backdrop"><section class="modal pdf-viewer"><div class="pdf-view-head"><div class="head-text"><h2>${esc(memo.title)}</h2><small>แสดงจาก Google Drive ภายใน OH Store Hub</small></div><a class="ghost-btn" href="${esc(memo.viewUrl||memo.previewUrl)}" target="_blank" rel="noopener" style="display:grid;place-items:center;text-decoration:none">เปิดแยก</a><button class="icon-btn" onclick="closePdfViewer()">×</button></div><iframe class="pdf-iframe" src="${esc(memo.previewUrl)}" title="${esc(memo.title)}" allow="autoplay"></iframe></section></div>`}
function renderMemo(){if(!state.memoLoaded&&!state.memoLoading)setTimeout(loadMemos,0);const visible=state.memos.filter(m=>state.memoFilter==="all"||memoStatus(m).key===state.memoFilter||(state.memoFilter==="active"&&["active","soon","upcoming"].includes(memoStatus(m).key)));return `${header(true,"Memo & Promotion")}<main class="shell"><div class="page-head"><div class="head-text"><div class="eyebrow">เอกสารภายในร้าน</div><h1 class="page-title">Memo & Promotion</h1><p class="page-sub">แตะการ์ดเพื่ออ่าน PDF ในเว็บนี้ได้ทันที</p></div><button class="primary-btn" onclick="openMemoModal()">＋ เพิ่ม PDF</button></div><div class="memo-toolbar"><div class="memo-tabs">${[["active","กำลังใช้"],["expired","หมดอายุ"],["all","ทั้งหมด"]].map(([key,label])=>`<button class="${state.memoFilter===key?'active':''}" onclick="state.memoFilter='${key}';render()">${label}</button>`).join("")}</div><span class="page-sub">${visible.length} รายการ</span></div><section class="memo-grid">${state.memoLoading?`<div class="empty panel">กำลังโหลดเอกสาร…</div>`:visible.map(m=>{const status=memoStatus(m);return `<article style="position:relative"><button class="memo-card" onclick="openPdfViewer('${m.id}')"><div class="memo-thumb">${m.thumbnail?`<img src="${m.thumbnail}" alt="หน้าปก ${esc(m.title)}">`:`<span class="pdf-fallback">PDF</span>`}</div><div class="memo-copy"><h3>${esc(m.title)}</h3><p>${esc(m.note||({promotion:"โปรโมชั่น",memo:"บันทึกข้อความ",announcement:"ประกาศ"}[m.type]||"เอกสาร"))}</p><div class="memo-meta"><span class="memo-badge ${status.key}">${status.label}</span>${m.expiryDate?`<small>ถึง ${new Intl.DateTimeFormat('th-TH',{dateStyle:'medium'}).format(new Date(m.expiryDate+'T00:00:00'))}</small>`:""}</div></div></button>${canDeleteMemo(m)?`<button class="tiny-btn delete" style="position:absolute;right:9px;top:9px" onclick="event.stopPropagation();deleteMemo('${m.id}')">ลบ</button>`:""}</article>`}).join("")||`<div class="empty panel">ยังไม่มีเอกสารในหมวดนี้</div>`}</section></main>${state.memoModal?renderMemoModal():""}${state.pdfViewer?renderPdfViewer():""}`}

function render(){const views={who:renderWho,home:renderHome,schedule:()=>renderSchedule(false),day:()=>renderSchedule(true),person:renderPerson,store:renderStore,history:renderHistory,counting:renderCounting,usage:renderUsage,memo:renderMemo};document.body.classList.toggle("home-body",state.view==="home");const content=(views[state.view]||renderHome)();document.getElementById("app").innerHTML=content+(state.view!=="who"?bottomNav():"")}
window.addEventListener("popstate",event=>{if(state.modal){closeModal(true);return}if(state.scheduleEditor){closeScheduleEditor(true);return}if(state.rosterModal){closeRosterModal(true);return}if(state.memoModal){closeMemoModal(true);return}if(state.pdfViewer){closePdfViewer(true);return}const target=event.state?.view||location.hash.replace("#","")||"home";state.view=target;render();window.scrollTo(0,0)});
const initialHash=location.hash.replace("#","");if(initialHash&&["who","home","schedule","day","person","store","history","counting","usage","memo"].includes(initialHash))state.view=initialHash;window.history.replaceState({view:state.view},"",`#${state.view}`);
seedScheduleFromSourceImage();
render();
loadRemoteSchedules();
loadRemoteEmployees();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body>
