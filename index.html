async function parseScheduleImage(file,img){const ed=state.scheduleEditor,canvas=document.createElement("canvas"),maxWidth=1800,scale=Math.min(1,maxWidth/img.naturalWidth);canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);const ctx=canvas.getContext("2d",{willReadFrequently:true});ctx.drawImage(img,0,0,canvas.width,canvas.height);const roster=employees.filter(e=>e.id!=="p00"),rowCount=roster.length,colCount=ed.dates.length,xStart=canvas.width*.232,xEnd=canvas.width*.997,yStart=canvas.height*.102,yEnd=canvas.height*.995,rowH=(yEnd-yStart)/Math.max(1,rowCount),colW=(xEnd-xStart)/colCount;let words=[];try{const T=await loadTesseract();const result=await T.recognize(canvas,"eng",{logger:m=>{if(m.status==="recognizing text")updateImportStatus(`กำลังอ่านตัวเลขจากรูป ${Math.round((m.progress||0)*100)}%`,15+(m.progress||0)*65)}});words=result?.data?.words||[]}catch(error){updateImportStatus("อ่านสีในตารางได้ แต่ระบบอ่านข้อความจากรูปไม่สำเร็จ",78)}let found=0;roster.forEach((emp,row)=>{ed.data[emp.id]??={};ed.dates.forEach((date,col)=>{const x0=xStart+col*colW,x1=x0+colW,y0=yStart+row*rowH,y1=y0+rowH;let code=cellColorCode(ctx,x0+1,y0+1,x1-1,y1-1);if(!code){const matches=words.filter(w=>{const box=w.bbox||{},cx=((box.x0||0)+(box.x1||0))/2,cy=((box.y0||0)+(box.y1||0))/2;return cx>=x0&&cx<x1&&cy>=y0&&cy<y0+rowH*.62}).map(w=>normalizeOcrShift(w.text)).filter(Boolean);code=matches[0]||null}if(code){ed.data[emp.id][dateKey(date)]=code;found++}})});const total=roster.length*ed.dates.length,unresolved=total-found;updateImportStatus(`อ่านได้ ${found} ช่อง · เหลือ ${unresolved} ช่องให้แตะตรวจ`,100);render();toast("อ่านรูปเป็นตารางร่างแล้ว กรุณาตรวจช่อง — ก่อนบันทึก")}

async function saveScheduleEditor(){const ed=state.scheduleEditor;if(ed.protectedNextCycle&&dateKey(ed.start)!==dateKey(getNextScheduleCycleStart())){toast("มีตารางรอบใหม่ถูกบันทึกแล้ว กรุณาปิดและอัปโหลดรูปอีกครั้ง");return}const touched=new Set();Object.entries(ed.data).forEach(([empId,days])=>Object.entries(days).forEach(([dk,shift])=>{const d=new Date(dk+"T00:00:00"),mk=monthKey(d);scheduleMonths[mk]??={};scheduleMonths[mk][empId]??={};scheduleMonths[mk][empId][dk]=shift;touched.add(mk)}));localStorage.setItem("oh_last_schedule_cycle",dateKey(ed.start));saveData();state.selectedDate=new Date(ed.start);state.scheduleEditor=null;consumeOverlay();render();toast(`บันทึกตารางรอบ ${fmtDate(ed.start,false)} – ${fmtDate(ed.end,false)} แล้ว`);try{await Promise.all([...touched].map(mk=>fetch(`${CONFIG.firebaseDatabaseUrl}/work_schedules/${mk}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(scheduleMonths[mk])})))}catch(e){toast("บันทึกในเครื่องแล้ว แต่ยังส่งขึ้นระบบกลางไม่สำเร็จ")}}

function renderRosterModal(){const rows=employees.map(emp=>`<div class="roster-row">${avatarArt(emp)}<span><b>${esc(emp.nick)}</b><small>${esc(emp.role)} · ${emp.gender==="F"?"หญิง":"ชาย"}${emp.id==="p00"?" · ผู้จัดการหลัก":""}</small></span><div class="roster-row-actions"><button class="tiny-btn" onclick="randomizeEmployeeAvatar('${emp.id}')">🎲 สุ่ม Pixel</button>${emp.id==="p00"?"":`<button class="tiny-btn delete" onclick="removeEmployee('${emp.id}')">ลบ</button>`}</div></div>`).join("");return `<div class="modal-backdrop" onclick="if(event.target===this)closeRosterModal()"><section class="modal roster-modal"><div class="editor-head"><div class="head-text"><h2>จัดการพนักงาน</h2><p>ผู้จัดการสุ่ม Pixel ได้ ส่วนรูปจริงต้องให้เจ้าตัวอัปโหลดจากชื่อของตนเอง</p></div><button class="icon-btn" onclick="closeRosterModal()">×</button></div><div class="roster-list">${rows}</div><form class="add-person" onsubmit="addEmployee(event)"><h3>＋ เพิ่มพนักงาน</h3><div class="person-form"><div class="field"><label>ชื่อเล่น</label><input name="nick" maxlength="30" placeholder="เช่น น้องเอ" required></div><div class="field"><label>ตำแหน่ง</label><input name="role" maxlength="40" placeholder="พนักงานบาร์"></div><div class="field"><label>รูปแบบตัวละคร</label><select name="gender"><option value="F">ผู้หญิง</option><option value="M">ผู้ชาย</option></select></div><button class="primary-btn wide" type="submit">สุ่มตัวละครและเพิ่มคนนี้</button></div><p class="roster-note">ระบบจะสุ่มสีเสื้อ สีผม ทรงผม และเครื่องประดับให้ คนใหม่จะมีตารางว่างรอใส่กะ</p></form></section></div>`}
function moveScheduleMonth(delta){const d=new Date(state.selectedDate);d.setDate(1);d.setMonth(d.getMonth()+delta);state.selectedDate=startOfDay(d);render()}

function renderPersonWeek(emp,start){let cards="";for(let i=0;i<7;i++){const d=addDays(start,i),code=getShift(emp,d),s=shiftInfo[code],today=dateKey(d)===dateKey(new Date());cards+=`<button class="day-card shift-${code} ${today?'today':''} ${code==='OFF'?'off':''}" onclick="state.selectedDate=startOfDay(new Date('${dateKey(d)}T00:00:00'));state.view='day';render()"><div class="dow">${thaiDays[d.getDay()]}</div><div class="num">${d.getDate()}</div><div class="shift">${s.label}</div></button>`}return `<div class="panel"><div class="panel-head"><h3>${fmtDate(start,false)} – ${fmtDate(addDays(start,6),false)}</h3><span class="count">กดวันที่เพื่อดูทุกคน</span></div><div style="padding:16px"><div class="week-grid">${cards}</div></div></div>`}

function productCategory(p){const code=String(p.code||"").trim().toUpperCase();return code.endsWith("D")?"dry":code.endsWith("C")?"chill":code.endsWith("F")?"freeze":"other"}
function categoryInfo(p){return {dry:{label:"ของแห้ง",icon:"☀"},chill:{label:"ชิล",icon:"❄"},freeze:{label:"แช่แข็ง",icon:"🧊"},other:{label:"อื่น ๆ",icon:"•"}}[productCategory(p)]}
function isLowStock(p){return Number(p.stock)<=2}
function filteredProducts(q=state.storeQuery){q=q.trim().toLowerCase();const found=products.filter(p=>(!q||[p.easy,p.code,p.real].some(v=>String(v).toLowerCase().includes(q)))&&(state.storeCategory==="all"||state.storeCategory==="low"&&isLowStock(p)||productCategory(p)===state.storeCategory));if(state.storeCategory==="low")return found.sort((a,b)=>Number(a.stock)-Number(b.stock)||String(a.easy).localeCompare(String(b.easy),"th"));return found}
function storeCategoryTabs(){const tabs=[["all","ทั้งหมด"],["dry","ของแห้ง"],["chill","ชิล"],["freeze","แช่แข็ง"],["low","ใกล้หมด"]];return `<div class="category-tabs">${tabs.map(([key,label])=>`<button class="${state.storeCategory===key?'active':''}" onclick="state.storeCategory='${key}';render()">${label}</button>`).join("")}</div>`}
function storeSummary(){return {items:products.length,total:products.reduce((s,p)=>s+p.stock,0),low:products.filter(isLowStock).length,today:history.filter(h=>dateKey(new Date(h.time))===dateKey(new Date())).length}}
function activeEmployee(){return employees.find(e=>e.id===state.currentUser)||null}
function productLastBadge(p){if(!p.last)return `<span class="badge">ยังไม่มีรายการ</span>`;const label=p.last.type==="receive"?`รับเข้า ${p.last.qty}`:p.last.type==="issue"?`เบิกออก ${p.last.qty}`:p.last.type==="adjust"?`ปรับยอด ${p.last.before??""}→${p.last.after??p.stock}`:"อัปเดตจากชีต";return `<span class="badge ${p.last.type==="receive"?"in":p.last.type==="issue"?"out":""}">${label}</span>`}
function productTableRow(p){const c=categoryInfo(p),level=p.stock<=0?"empty":isLowStock(p)?"low":"ok";return `<tr class="${state.flashId===p.id?'flash':''}"><td><b>${esc(p.easy)}</b><span class="category-badge ${productCategory(p)}">${c.label}</span></td><td class="code">${esc(p.code)}</td><td>${esc(p.real)}</td><td><span class="balance balance-${level}">${p.stock.toLocaleString('th-TH')} ${esc(p.unit)}</span></td><td>${esc(p.unit)}</td><td>${productLastBadge(p)}</td><td><button class="ghost-btn" onclick="openStockModal('receive','${p.id}')">ทำรายการ</button></td></tr>`}
function productCard(p){const c=categoryInfo(p),level=p.stock<=0?"empty":isLowStock(p)?"low":"ok";return `<button class="stock-card ${state.flashId===p.id?'flash':''}" onclick="openStockModal('receive','${p.id}')"><div class="stock-card-top"><div class="stock-card-main"><span class="category-badge ${productCategory(p)}">${c.icon} ${c.label}</span><h3>${esc(p.easy)}</h3><div class="stock-code">รหัส ${esc(p.code)}</div><p class="stock-real">${esc(p.real)}</p></div><div class="stock-balance balance-${level}"><small>คงเหลือ</small><b>${p.stock.toLocaleString('th-TH')}</b><span>${esc(p.unit)}</span></div></div><div class="stock-card-bottom">${productLastBadge(p)}<span class="badge">แตะเพื่อทำรายการ ›</span></div></button>`}
function easyCatalogName(name){return String(name||"").replace(/\([^)]*\)/g,"").replace(/^(สำเร็จรูป|ผลไม้แช่แข็ง|ผลไม้|วัตถุดิบต้ม|HQผักล้างแปรรูป|HQ|ผักTopping|นมเปรี้ยวโยเกิร์ต|น้ำผลไม้)\s*/i,"").trim().slice(0,42)||String(name||"")}
async function syncStoreCatalog(){if(state.catalogLoading)return;state.catalogLoading=true;if(state.view==="store")render();try{const [dailyRes,weeklyRes,inventoryRes]=await Promise.all([fetch(`${CONFIG.sheetsWebAppUrl}?mode=daily`),fetch(`${CONFIG.sheetsWebAppUrl}?mode=weekly`),fetch(`${CONFIG.firebaseDatabaseUrl}/store_hub_inventory.json`)]);if(!dailyRes.ok||!weeklyRes.ok)throw new Error("catalog");const daily=await dailyRes.json(),weekly=await weeklyRes.json(),catalog=[...new Map([...daily,...weekly].map(item=>[String(item.id),item])).values()],central=inventoryRes.ok?(await inventoryRes.json()||{}):{},old=new Map(products.map(p=>[p.code,p]));products=catalog.map(item=>{const prev=old.get(String(item.id))||{},saved=central[String(item.id)]||{};return {id:String(item.id),easy:saved.easy||prev.easy||easyCatalogName(item.name),code:String(item.id),real:item.name||"",category:item.category||"ทั่วไป",stock:Number(saved.stock??prev.stock??0),unit:item.unit||"หน่วย",min:Number(saved.min??prev.min??0),last:saved.last||prev.last||null}});state.catalogLoaded=true;saveData()}catch(e){toast("ยังดึงรายการจากระบบนับของไม่ได้ จะแสดงข้อมูลที่บันทึกไว้ก่อน")}finally{state.catalogLoading=false;if(state.view==="store")render()}}
async function sheetPost(payload){const r=await fetch(CONFIG.sheetsWebAppUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),redirect:"follow"});if(!r.ok)throw new Error("sheet");const data=await r.json();if(data.status&&data.status!=="success")throw new Error(data.message||"sheet");return data}
function setStoreDirty(value){state.storeDirty=Boolean(value);localStorage.setItem("oh_store_dirty",state.storeDirty?"1":"0")}
function assertHubResponse(data,mode){if(!data||data.status!=="success"||data.apiVersion!==CONFIG.apiVersion||data.mode!==mode||data.spreadsheetId!==CONFIG.storeSpreadsheetId||(mode==="store"||mode==="storeSave")&&data.sheetName!=="สโตร์")throw new Error("wrong_deployment");return data}
async function pullStoreFromSheet(){if(state.storeSyncing)return;if(state.storeDirty&&!confirm("มีข้อมูลในแอปที่ยังไม่ได้บันทึกลงชีต หากดึงข้อมูล ยอดเหล่านั้นอาจถูกแทนที่\n\nต้องการดำเนินการต่อหรือไม่?"))return;state.storeSyncing=true;render();try{const r=await fetch(`${CONFIG.sheetsWebAppUrl}?mode=store&t=${Date.now()}`);if(!r.ok)throw new Error("sheet");const data=assertHubResponse(await r.json(),"store"),items=Array.isArray(data.items)?data.items:[];if(!items.length){toast("ชีตสโตร์ยังไม่มีข้อมูล กรุณากดบันทึกลงชีตก่อน");return}const byCode=new Map(items.map(x=>[String(x.id||x.code),x]));products.forEach(p=>{const row=byCode.get(String(p.code));if(row){p.stock=Number(row.stock??row.balance??0);p.last=row.updatedAt?{type:"sync",qty:0,time:row.updatedAt,operator:row.updatedBy||"ชีต"}:p.last}});saveData();setStoreDirty(false);state.storeLastSync=new Date().toISOString();localStorage.setItem("oh_store_last_sync",state.storeLastSync);render();toast(`ดึงข้อมูลจากชีตแล้ว ${items.length} รายการ`)}catch(error){toast(error.message==="wrong_deployment"?"หยุดดึงข้อมูล: Apps Script ยังเป็นเวอร์ชันเก่า":"ดึงข้อมูลจากชีตไม่สำเร็จ กรุณาตรวจ Apps Script")}finally{state.storeSyncing=false;if(state.view==="store")render()}}
async function saveStoreToSheet(){if(state.storeSyncing)return;const user=activeEmployee();if(!user){toast("กรุณาเลือกชื่อผู้ใช้งานก่อน");return}if(!confirm(`บันทึกยอดสโตร์ปัจจุบัน ${products.length} รายการลงชีต โดย ${user.nick} ใช่หรือไม่?`))return;state.storeSyncing=true;render();try{const result=assertHubResponse(await sheetPost({mode:"storeSave",operator:user.nick,operatorId:user.id,items:products.map(p=>({id:p.code,name:p.real,unit:p.unit,stock:Number(p.stock)||0,updatedAt:p.last?.time||"",updatedBy:p.last?.operator||""}))}),"storeSave");if(result.count!==products.length)throw new Error("count_mismatch");setStoreDirty(false);state.storeLastSync=new Date().toISOString();localStorage.setItem("oh_store_last_sync",state.storeLastSync);render();toast(`บันทึกลงชีตสโตร์แล้ว ${result.count} รายการ · โดย ${user.nick}`)}catch(error){setStoreDirty(true);toast(error.message==="wrong_deployment"?"หยุดบันทึก: Apps Script ยังเป็นเวอร์ชันเก่า · ไม่ได้แตะ Stock_Weekly":"ยังบันทึกลงชีตไม่สำเร็จ ข้อมูลในแอปยังอยู่")}finally{state.storeSyncing=false;if(state.view==="store")render()}}
function renderStore(){if(!state.catalogLoaded&&!state.catalogLoading)setTimeout(syncStoreCatalog,0);const s=storeSummary(),user=activeEmployee(),found=filteredProducts(),rows=found.map(productTableRow).join(""),cards=found.map(productCard).join(""),syncText=state.storeDirty?"มีข้อมูลที่ยังไม่ได้บันทึกลงชีต":state.storeLastSync?`บันทึกลงชีตล่าสุด ${new Intl.DateTimeFormat('th-TH',{dateStyle:'short',timeStyle:'short'}).format(new Date(state.storeLastSync))}`:"ยังไม่ได้ซิงก์กับชีตในเครื่องนี้";return `${header(true,"สโตร์")}<main class="shell"><section class="store-hero"><div class="store-hero-copy"><div class="eyebrow">OH STORE INVENTORY</div><h1>สโตร์หลังร้าน</h1><p>${state.catalogLoading?'กำลังดึงรายการสินค้าล่าสุด…':'รับเข้า เบิกออก และเช็กยอดคงเหลือของแต่ละสินค้าได้จากหน้าเดียว'}</p></div>${user?`<div class="store-user">${avatarArt(user)}<span><small>ผู้ทำรายการ</small><b>${esc(user.nick)}</b></span></div>`:""}</section><div class="sync-panel"><div class="sync-status"><b><span class="${state.storeDirty?'dirty-dot':'clean-dot'}"></span>${syncText}</b><small>ซิงก์ยอดกับชีตสโตร์เมื่อพร้อม เพื่อให้ทุกเครื่องเห็นข้อมูลตรงกัน</small></div><button class="sync-btn" ${state.storeSyncing?'disabled':''} onclick="pullStoreFromSheet()">↓ ดึงข้อมูลจากชีต</button><button class="sync-btn save" ${state.storeSyncing?'disabled':''} onclick="saveStoreToSheet()">↑ บันทึกลงชีต</button></div>${renderUndoBanner()}<div class="summary-row store-summary-row"><div class="summary"><b>${s.items}</b><span>รายการสินค้า</span></div><div class="summary red"><b>${s.low}</b><span>ใกล้หมด</span></div><div class="summary orange"><b>${s.today}</b><span>เคลื่อนไหววันนี้</span></div></div>${storeCategoryTabs()}<div class="toolbar"><label class="search"><input value="${esc(state.storeQuery)}" oninput="state.storeQuery=this.value;localStorage.setItem('oh_store_query',this.value);renderStoreRows()" placeholder="ค้นหาชื่อ รหัส หรือชื่อจริง"></label><div class="store-actions"><button class="ghost-btn" onclic function renderStoreRows(){const body=document.getElementById("storeRows"),cards=document.getElementById("storeCards"),found=filteredProducts();if(body)body.innerHTML=found.map(productTableRow).join("")||`<tr><td colspan="7" class="empty">ไม่พบสินค้าที่ค้นหา</td></tr>`;if(cards)cards.innerHTML=found.map(productCard).join("")||`<div class="empty panel">ไม่พบสินค้าที่ค้นหา</div>`}
function openStockModal(type,productId=null){state.modal=type;state.cart=[];state.productQuery="";state.modalQty=1;state.adjustReason="forgot_issue";state.selectedProduct=productId;if(type==="adjust"&&productId){const p=products.find(x=>x.id===productId);if(p)state.modalQty=Number(p.stock)||0}pushOverlay("stock");render()}
function switchStockMode(type){if(state.modal===type)return;state.modal=type;state.cart=[];state.adjustReason="forgot_issue";const p=products.find(x=>x.id===state.selectedProduct);state.modalQty=type==="adjust"&&p?Number(p.stock)||0:1;render()}

function updateModalResults(){const target=document.getElementById("modalResults");if(target)target.innerHTML=modalResults()}
function renderSelectedProduct(p){const user=activeEmployee(),isIn=state.modal==="receive",isAdjust=state.modal==="adjust",current=Number(p.stock)||0,target=isAdjust?Math.max(0,Number(state.modalQty)||0):null,delta=isAdjust?target-current:0,reason=state.adjustReason||"forgot_issue";return `<div class="selected-product quick-product"><p class="product-full">${esc(p.code)} · ${esc(p.real)}</p><div class="current-balance">คงเหลือปัจจุบัน <strong>${current.toLocaleString("th-TH")}</strong> ${esc(p.unit)}</div><label class="qty-label">${isAdjust?'ปรับยอดจริงเป็น':`จำนวน${isIn?'รับเข้า':'เบิกออก'}`}</label><div class="stepper"><button type="button" ${state.transactionBusy?'disabled':''} onclick="changeQty(-1,'${p.id}')">−</button><input id="qtyInput" type="number" min="${isAdjust?'0':'1'}" step="1" inputmode="numeric" value="${state.modalQty}" ${state.transactionBusy?'disabled':''} oninput="state.modalQty=Number(this.value||0);updateProjection('${p.id}')"><button type="button" ${state.transactionBusy?'disabled':''} onclick="changeQty(1,'${p.id}')">＋</button></div><div class="projection" id="projection">${projectionHtml(p,state.modalQty)}</div>${isAdjust?`<div class="adjust-reason"><label>เหตุผลกรณีปรับยอดลด (ค่าเริ่มต้น)</label><select ${state.transactionBusy?'disabled':''} onchange="state.adjustReason=this.value"><option value="forgot_issue" ${reason==='forgot_issue'?'selected':''}>ลืมเบิก / ของถูกหยิบออก</option><option value="waste" ${reason==='waste'?'selected':''}>ของเสีย / ทิ้ง</option><option value="count_mismatch" ${reason==='count_mismatch'?'selected':''}>นับคลาดเคลื่อน</option><option value="other" ${reason==='other'?'selected':''}>อื่น ๆ</option></select></div><div class="reliability-note">ปรับเพิ่มจะไม่ถือเป็น “รับเข้าใหม่” · ปรับลดใช้เหตุผลด้านบน โดยค่าเริ่มต้นคือ “ลืมเบิก”</div>`:""}${user?`<div class="quick-operator">ทำรายการโดย <b>${esc(user.nick)}</b></div>`:""}<button class="quick-confirm ${isIn?'receive':isAdjust?'adjust':'issue'}" ${state.transactionBusy?'disabled':''} onclick="confirmSelectedProduct('${p.id}',this)">${state.transactionBusy?'กำลังบันทึก…':isAdjust?'ยืนยันปรับยอด':`ยืนยัน${isIn?'รับเข้า':'เบิกออก'}`}</button></div>`}
function projectionHtml(p,value){const current=Number(p.stock)||0,q=Math.max(0,Number(value)||0),after=state.modal==="receive"?current+q:state.modal==="issue"?current-q:q,delta=after-current,label=state.modal==="adjust"?`ยอดใหม่ <strong>${after}</strong> ${esc(p.unit)} <small>(${delta>0?'+':''}${delta})</small>`:`หลังทำรายการจะเหลือ <strong>${after}</strong> ${esc(p.unit)}`;return label}
function updateProjection(id){const p=products.find(x=>x.id===id),q=Math.max(0,Number(document.getElementById("qtyInput")?.value||0)),el=document.getElementById("projection");if(el)el.innerHTML=projectionHtml(p,q);state.modalQty=q}
function changeQty(delta,id){const input=document.getElementById("qtyInput");if(!input||state.transactionBusy)return;const min=state.modal==="adjust"?0:1;state.modalQty=Math.max(min,Number(input.value||min)+delta);input.value=state.modalQty;updateProjection(id)}
async function getCentralStock(product){try{const r=await fetch(`${CONFIG.firebaseDatabaseUrl}/store_hub_inventory/${encodeURIComponent(product.id)}.json?t=${Date.now()}`);if(!r.ok)return null;const data=await r.json();return data&&Number.isFinite(Number(data.stock))?Number(data.stock):null}catch(e){return null}}
async function centralNowIso(){try{const r=await fetch(`${CONFIG.firebaseDatabaseUrl}/.info/serverTimeOffset.json?t=${Date.now()}`);if(r.ok){const offset=Number(await r.json());if(Number.isFinite(offset))return new Date(Date.now()+offset).toISOString()}}catch(e){}return new Date().toISOString()}
async function confirmSelectedProduct(id,button){if(state.transactionBusy)return;const p=products.find(x=>x.id===id),raw=Number(document.getElementById("qtyInput")?.value||0),current=Number(p.stock)||0,isAdjust=state.modal==="adjust",isIssue=state.modal==="issue";if(!Number.isFinite(raw)||(isAdjust?raw<0:raw<=0)){toast(isAdjust?"ยอดใหม่ต้องเป็น 0 หรือมากกว่า":"จำนวนต้องมากกว่า 0");return}const qty=isAdjust?Math.abs(raw-current):raw,after=isAdjust?raw:(isIssue?current-raw:current+raw);if(isAdjust&&after===current){toast("ยอดใหม่เท่ากับยอดปัจจุบัน ยังไม่มีอะไรให้ปรับ");return}if(isIssue&&qty>current){toast(`เบิกไม่ได้ · คงเหลือเพียง ${current} ${p.unit}`);return}const delta=Math.abs(after-current),unusual=delta>50||(current>0&&delta>Math.max(10,current*.75));if(unusual&&!confirm(`ยอดเปลี่ยนจาก ${current} → ${after} ${p.unit}\nเป็นการเปลี่ยนแปลงค่อนข้างมาก ต้องการดำเนินการต่อหรือไม่?`))return;if(!confirm(`${isAdjust?'ปรับยอด':isIssue?'เบิกออก':'รับเข้า'} ${p.easy}\n${current} → ${after} ${p.unit}\n\nยืนยันรายการนี้หรือไม่?`))return;state.cart=[{id,qty,before:current,target:after,reason:isAdjust?(after<current?(state.adjustReason||"forgot_issue"):"count_plus"):""}];await confirmTransaction()}
async function addToOldestExpiryLot(lines,now,user){
  await ensureExpiryLotsLoaded();
  const changes=[];
  for(const line of lines){
    const qty=Math.max(0,Number(line.qty)||0);
    if(!qty)continue;
    const p=productByAnyId(line.productId);
    if(!p)continue;
    const lots=state.expiryLots
      .filter(l=>!l.acknowledged && (String(l.productId)===String(p.id) || String(l.code)===String(p.code)))
      .sort((a,b)=>String(a.receivedAt||a.receivedDate||"").localeCompare(String(b.receivedAt||b.receivedDate||"")));
    const lot=lots[0];
    if(lot){
      lot.storeQty=lotStoreQty(lot)+qty;
      changes.push({kind:"lot_add",lotId:lot.id,qty});
      await fetch(`${CONFIG.firebaseDatabaseUrl}/store_hub_expiry_lots/${lot.id}.json`,{
        method:"PATCH",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({storeQty:lot.storeQty,lastAdjustedAt:now,lastAdjustedBy:user.nick})
      });
    }else{
      const id=`lot_adjust_${Date.now()}_${firebaseSafeKey(p.id)}`;
      const payload={
        productId:p.id,code:p.code,easy:p.easy,unit:p.unit,qty,storeQty:qty,frontQty:0,
        receivedDate:dateKey(new Date(now)),receivedAt:now,reviewDate:dateKey(new Date(now)),
        ruleDays:0,receivedBy:user.nick,receivedById:user.id,acknowledged:false,adjustmentUntracked:true
      };
      state.expiryLots.push({id,...payload});
      changes.push({kind:"lot_create",lotId:id,qty});
      await fetch(`${CONFIG.firebaseDatabaseUrl}/store_hub_expiry_lots/${id}.json`,{
        method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)
      });
    }
  }

}

function openLifeDateText(amount,unit,start=new Date()){
  if(!amount)return "—";
  const exp=openExpiryAt(amount,unit,start);
  const day=new Intl.DateTimeFormat("th-TH",{weekday:"long"}).format(exp);
  const date=new Intl.DateTimeFormat("th-TH",{day:"numeric",month:"long",year:"numeric"}).format(exp);
  const time=new Intl.DateTimeFormat("th-TH",{hour:"2-digit",minute:"2-digit",hour12:false}).format(exp);
  return {exp,day,date,time};
}

async function scanProcessedPage(page){const img=await scanLoadImage(page.data),rot=Number(page.rotation||0)%360,swap=rot===90||rot===270,c=document.createElement("canvas");c.width=swap?img.naturalHeight:img.naturalWidth;c.height=swap?img.naturalWidth:img.naturalHeight;const x=c.getContext("2d",{alpha:false,willReadFrequently:true});x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.save();x.translate(c.width/2,c.height/2);x.rotate(rot*Math.PI/180);x.drawImage(img,-img.naturalWidth/2,-img.naturalHeight/2);x.restore();if(state.scanMode==="document"){const d=x.getImageData(0,0,c.width,c.height),a=d.data;for(let i=0;i<a.length;i+=4){let g=.299*a[i]+.587*a[i+1]+.114*a[i+2];g=(g-128)*1.22+128;g=Math.max(0,Math.min(255,g));a[i]=a[i+1]=a[i+2]=g}x.putImageData(d,0,0)}return c}

function scanSafeName(v){const t=String(v||"").trim().replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g," ");return (t||`scan_${dateKey(new Date())}`).slice(0,80)}
async function buildScanPdf(){if(!state.scanPages.length){toast("ถ่ายหรือเพิ่มภาพก่อน");return null}if(state.scanBuilding)return null;state.scanBuilding=true;try{await loadJsPdf();const {jsPDF}=window.jspdf;let pdf=null;for(let i=0;i<state.scanPages.length;i++){const c=await scanProcessedPage(state.scanPages[i]),land=c.width>c.height,orientation=land?"landscape":"portrait";if(!pdf)pdf=new jsPDF({orientation,unit:"mm",format:"a4",compress:true});else pdf.addPage("a4",orientation);const pw=land?297:210,ph=land?210:297,margin=7,maxW=pw-margin*2,maxH=ph-margin*2,scale=Math.min(maxW/c.width,maxH/c.height),w=c.width*scale,h=c.height*scale,x=(pw-w)/2,y=(ph-h)/2;pdf.addImage(c.toDataURL("image/jpeg",.88),"JPEG",x,y,w,h,undefined,"FAST")}return pdf.output("blob")}catch(e){console.error(e);toast("สร้าง PDF ไม่สำเร็จ");return null}finally{state.scanBuilding=false}}
async function shareScanPdf(){const blob=await buildScanPdf();if(!blob)return;const name=scanSafeName(document.getElementById("scanFileName")?.value)+".pdf",file=new File([blob],name,{type:"application/pdf"});try{if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name,text:"เอกสารสแกนจาก OH Store Hub"});toast("เปิดเมนูแชร์แล้ว");return}}catch(e){if(e?.name==="AbortError")return}const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast("เครื่องนี้แชร์ไฟล์ตรงไม่ได้ จึงดาวน์โหลด PDF ให้แทน")}
function renderScanner(){const pages=state.scanPages;return `${header(true,"สแกนเป็น PDF")}<main class="shell"><div class="scanner-shell"><section class="scan-hero"><div class="eyebrow" style="color:#a9cfbf">DOCUMENT SCANNER</div><h1>ถ่ายเอกสาร → PDF</h1><p>ถ่ายเอกสารหลายหน้า จัดลำดับให้เรียบร้อย แล้วสร้าง PDF พร้อมแชร์ผ่านมือถือได้ทันที</p></section><div class="scan-toolbar"><label class="scan-pick primary">📷 ถ่ายเอกสาร<input type="file" accept="image/*" capture="environment" onchange="scanAddFiles(this)"></label><label class="scan-pick secondary">＋ เพิ่มจากรูป<input type="file" accept="image/*" multiple onchange="scanAddFiles(this)"></label></div><div class="scan-options"><b>${pages.length} หน้า</b><div class="scan-mode"><button class="${state.scanMode==='document'?'active':''}" onclick="scanSetMode('document')">เอกสารชัด</button><button class="${state.scanMode==='color'?'active':''}" onclick="scanSetMode('color')">สีเดิม</button></div>${pages.length?`<button class="scan-mini danger" onclick="scanClearAll()">ล้างทั้งหมด</button>`:""}</div><section class="scan-list">${pages.map((p,i)=>`<article class="scan-page"><div class="scan-thumb"><img src="${p.data}" style="transform:rotate(${Number(p.rotation||0)}deg);filter:${state.scanMode==='document'?'grayscale(1) contrast(1.15)':'none'}"></div><div class="scan-info"><b>หน้า ${i+1}</b><small>${esc(p.name||'ภาพเอกสาร')}</small><div class="scan-actions"><button class="scan-mini" onclick="scanRotate('${p.id}')">↻ หมุน</button><button class="scan-mini" onclick="scanMove('${p.id}',-1)" ${i===0?'disabled':''}>↑ ขึ้น</button><button class="scan-mini" onclick="scanMove('${p.id}',1)" ${i===pages.length-1?'disabled':''}>↓ ลง</button><button class="scan-mini danger" onclick="scanDelete('${p.id}')">ลบ</button></div></div></article>`).join("")||`<div class="scan-empty"><b>ยังไม่มีหน้าเอกสาร</b>กด “ถ่ายเอกสาร” แล้วถ่ายทีละหน้าได้เลย</div>`}</section><div class="scan-bottom"><div class="scan-create"><input id="scanFileName" value="เอกสาร_${dateKey(new Date())}" placeholder="ชื่อไฟล์ PDF"><button class="primary-btn" onclick="shareScanPdf()" ${pages.length?'':'disabled'}>สร้าง PDF และแชร์</button></div><div class="scan-note">บนมือถือ เมื่อกดแชร์ให้เลือก LINE จากเมนูแชร์ได้เลย · ถ้าเบราว์เซอร์ไม่รองรับแชร์ไฟล์ ระบบจะดาวน์โหลด PDF ให้แทน</div></div></div></main>`}

function lotStoreQty(l){return Number(l.storeQty!=null?l.storeQty:l.qty)||0}
function lotFrontQty(l){return Number(l.frontQty||0)||0}
async function ensureExpiryLotsLoaded(){if(state.expiryLoaded)return;await loadExpiryData(true)}
async function moveExpiryLotsToFront(lines){
  await ensureExpiryLotsLoaded();const moves=[];
  for(const line of lines){const p=productByAnyId(line.productId);if(!p)continue;let left=Number(line.qty)||0;const lots=state.expiryLots.filter(l=>!l.acknowledged&&(String(l.productId)===String(p.id)||String(l.code)===String(p.code))&&lotStoreQty(l)>0).sort((a,b)=>String(a.receivedAt||a.receivedDate||"").localeCompare(String(b.receivedAt||b.receivedDate||"")));
    for(const lot of lots){if(left<=0)break;const take=Math.min(left,lotStoreQty(lot));if(take<=0)continue;lot.storeQty=lotStoreQty(lot)-take;lot.frontQty=lotFrontQty(lot)+take;left-=take;moves.push({lotId:lot.id,qty:take});await fetch(`${CONFIG.firebaseDatabaseUrl}/store_hub_expiry_lots/${lot.id}.json`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({storeQty:lot.storeQty,frontQty:lot.frontQty,lastMovedAt:new Date().toISOString()})}).catch(()=>null)}
  }return moves
}
async function reverseExpiryMoves(moves){if(!Array.isArray(moves)||!moves.length)return;await ensureExpiryLotsLoaded();for(const m of moves){const lot=state.expiryLots.find(x=>x.id===m.lotId);if(!lot)continue;const q=Number(m.qty)||0;lot.frontQty=Math.max(0,lotFrontQty(lot)-q);lot.storeQty=lotStoreQty(lot)+q;await fetch(`${CONFIG.firebaseDatabaseUrl}/store_hub_expiry_lots/${lot.id}.json`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({storeQty:lot.storeQty,frontQty:lot.frontQty})}).catch(()=>null)}}
async function consumeExpiryFrontFromUsage(rows,user){await ensureExpiryLotsLoaded();for(const row of rows||[]){let left=Math.max(0,Number(row.used)||0);if(left<=0)continue;const p=productByAnyId(row.id);if(!p)continue;const lots=state.expiryLots.filter(l=>!l.acknowledged&&(String(l.productId)===String(p.id)||String(l.code)===String(p.code))&&lotFrontQty(l)>0).sort((a,b)=>String(a.receivedAt||a.receivedDate||"").localeCompare(String(b.receivedAt||b.receivedDate||"")));for(const lot of lots){if(left<=0)break;const take=Math.min(left,lotFrontQty(lot));if(take<=0)continue;lot.frontQty=lotFrontQty(lot)-take;left-=take;const patch={frontQty:lot.frontQty,lastCountConsumeAt:new Date().toISOString()};if(lotStoreQty(lot)<=0&&lot.frontQty<=0){patch.acknowledged=true;patch.autoClosed=true;patch.acknowledgedAt=new Date().toISOString();patch.acknowledgedBy=`ระบบจากผลนับ${user?.nick?` · ${user.nick}`:""}`;Object.assign(lot,patch)}else Object.assign(lot,patch);await fetch(`${CONFIG.firebaseDatabaseUrl}/store_hub_expiry_lots/${lot.id}.json`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(patch)}).catch(()=>null)}}}

async function createExpiryLotsForReceive(lines,now,user){await ensureExpiryRulesLoaded();const writes=[];for(const x of lines){const p=productByAnyId(x.productId),rule=p?expiryRuleFor(p):null,days=Math.floor(Number(rule?.days||0));if(!p||days<1)continue;const receivedDate=dateKey(new Date(now)),reviewDate=dateKey(addDays(new Date(now),days)),id=`lot_${Date.now()}_${firebaseSafeKey(p.id)}_${Math.random().toString(36).slice(2,7)}`,payload={productId:p.id,code:p.code,easy:p.easy,unit:p.unit,qty:x.qty,storeQty:Number(x.qty)||0,frontQty:0,receivedDate,receivedAt:now,reviewDate,ruleDays:days,receivedBy:user.nick,receivedById:user.id,acknowledged:false};writes.push({id,payload});state.expiryLots.push({id,...payload})}if(writes.length){state.expiryLoaded=true;await Promise.all(writes.map(w=>fetch(`${CONFIG.firebaseDatabaseUrl}/store_hub_expiry_lots/${w.id}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(w.payload)})))}return writes.map(w=>w.id)}

let lastRenderedView=state.view;

function render(){const views={who:renderWho,home:renderHome,schedule:()=>renderSchedule(false),day:()=>renderSchedule(true),person:renderPerson,store:renderStore,history:renderHistory,counting:renderCounting,usage:renderUsage,memo:renderMemo,openmemo:renderOpenMemo,expiry:renderExpiry,qr:renderQr,scanner:renderScanner,leave:renderLeave};const sameView=lastRenderedView===state.view,keepY=sameView?window.scrollY:0;document.body.classList.toggle("home-body",state.view==="home");document.body.dataset.view=state.view;const content=(views[state.view]||renderHome)();document.getElementById("app").innerHTML=content+(state.view!=="who"?bottomNav():"");lastRenderedView=state.view;ensureGlobalUx();if(sameView&&keepY>0)requestAnimationFrame(()=>window.scrollTo({top:keepY,left:0,behavior:'instant'}))}
window.addEventListener("popstate",event=>{if(state.modal){closeModal(true);return}if(state.scheduleEditor){closeScheduleEditor(true);return}if(state.rosterModal){closeRosterModal(true);return}if(state.memoModal){closeMemoModal(true);return}if(state.pdfViewer){closePdfViewer(true);return}const target=event.state?.view||location.hash.replace("#","")||"home";state.view=target;render();window.scrollTo(0,0)});
const initialHash=location.hash.replace("#","");if(initialHash&&["who","home","schedule","day","person","store","history","counting","usage","memo","openmemo","expiry","qr","scanner","leave"].includes(initialHash))state.view=initialHash;window.history.replaceState({view:state.view},"",`#${state.view}`);
seedScheduleFromSourceImage();
render();
loadRemoteSchedules();
loadRemoteEmployees();
loadExpiryData(true);
loadOpenData(true);
loadLeaveData(true);
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
